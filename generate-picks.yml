name: Generate daily picks

on:
  schedule:
    # 09:00 UTC = 4:00 AM ET (winter) / 5:00 AM ET (summer), Mon-Fri.
    # Leaves hours of buffer before the app's 8:30 AM ET refresh, because
    # GitHub cron can start late and the model run can take a while.
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - name: Run the screen
        run: python backend/generate_picks.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit picks
        run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add data/picks.json
          git diff --staged --quiet || git commit -m "Update picks $(date -u +%F)"
          git push
